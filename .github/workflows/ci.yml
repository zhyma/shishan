name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Linux · Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check cross-language narrative fixtures
        run: |
          node apps/cli/dist/main.js check fixtures/polyglot --strict --no-freshness
          node apps/cli/dist/main.js check fixtures/advanced --strict --no-freshness

      - name: Check TypeScript projects
        run: npm run typecheck

      - name: Build packages, Web UI, and VS Code adapter
        run: npm run build

  incremental-benchmark:
    name: Incremental invariants
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify one-file updates stay one-file
        run: npm run benchmark:incremental -- --files=250
